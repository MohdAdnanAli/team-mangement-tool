<div class="mobile-topbar">
  <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">☰</button>
  <div class="brand-text" style="font-size:14px;">Ops Console</div>
</div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="shell">
  <aside class="sidebar" id="sidebarEl">
    <div class="brand">
      <div class="brand-mark">
        <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=120&q=80" alt="Ops Console logo" loading="lazy" referrerpolicy="no-referrer">

        <div class="brand-text">Ops Console</div>
        <div class="brand-sub">team command center</div>
      </div>
    </div>
    <nav id="navList"></nav>
    <div class="sidebar-footer">
      <div class="theme-toggle" id="themeToggle">
        <button class="theme-btn" data-theme-opt="light">Light</button>
        <button class="theme-btn" data-theme-opt="dark">Dark</button>
        <button class="theme-btn" data-theme-opt="system">System</button>
      </div>
      <button class="io-btn" id="exportBtn">⬇ Export data (PDF)</button>
      <div class="io-note">No server, no accounts. Everything lives in this tab. Export a checkbox PDF any time to hand out or archive progress.</div>
      <div class="studio-credit">A Dark-Matter Studio project<br>Developed &amp; maintained by Dark-Matter Labs Co.</div>
    </div>
  </aside>

  <main class="main">
    <div class="ticker" id="ticker"></div>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBody"></div>
</div>
